- key: features
  title: "Features"
  url: "/feature/batchoperations"
  isdoc: true
  description: "Below are the list of features available."
  topics:

  - title: "Batch Operations"
    url: "/feature/batchoperations"
    description: "It is the process of making the multiple single-operations be executed against the database in one-go."
  
  - title: "Bulk Operations"
    url: "/feature/bulkoperations"
    description: "It is the process of bringing all the data from the application into the database server at once, and at the same time, ignoring some database specific activities behind the scene. Thus gives you maximum performance during the operation."

  - title: "Caching"
    url: "/feature/caching"
    description: "In general terms, a `Cache` is a component that stores an object (or its states) in any form of temporary storage that is accessible for future used. The object that is being stored can be a result of computational, operational, inputs/outputs or analytical operations and calculations."

  - title: "Class Handlers"
    url: "/feature/classhandlers"
    description: "This is a feature that would allow you to handle the event during the serialization/deserialization process of the Model and the DbDataReader object (inbound/outbound)."

  - title: "Class Mapping"
    url: "/feature/classmapping"
    description: "This is a feature that would allow you to map the .NET CLR type (or class properties) into its equivalent database objects and types."

  - title: "Connection Persistency"
    url: "/feature/connectionpersistency"
    description: "This is a feature that enables you to manage the instance of the database connection object within the repository objects."

  - title: "Dynamics"
    url: "/feature/dynamics"
    description: "This feature allows you to work with RepoDB by maximizing the usage of dynamics."

  - title: "Enumeration"
    url: "/feature/enumeration"
    description: "This is a feature that enables you to work with enumerations within the class objects."

  - title: "Expression Trees"
    url: "/feature/expressiontrees"
    description: "This is a feature that would allow you to compose a conditional expressions (to filter a data) when doing an operation in the database."

  #- title: "Field/Class Mapping"
  #  url: "/feature/fieldclassmapping"

  - title: "Hints"
    url: "/feature/hints"
    description: "This is a feature that would allow you to optimize the command executions towards the database. It is a keyword that is usually being added into the SQL statements (DML) to further optimize the execution of your commands."

  - title: "Implicit Mapping"
    url: "/feature/implicitmapping"
    description: "This is a feature that would allow you to implicitly map the .NET CLR objects or class properties into its equivalent object in the database. Certain mapper classes has been provided in order to avoid the usage of the attributes in the classes."

  - title: "Multiple Query"
    url: "/feature/multiplequery"
    description: "This is a feature that would allow you to fetch multiple resultsets in a single call."

  - title: "Property Handlers"
    url: "/feature/propertyhandlers"
    description: "This is a feature that would allow you to handle the tranformation of the class properties and database columns (inbound/outbound)."

  - title: "Repositories"
    url: "/feature/repositories"
    description: "A repository is a software design pattern and practice in which it is being implemented as an additional layer between your application and your database. It is being represented as a class object within the application. Through repository, you are managing how the data is being manipulated from/to the database."

  - title: "Targeted Operations"
    url: "/feature/targeted"
    description: "This feature allows you to make a targeted invocation when executing the operations againts the database."

  - title: "Telemetry"
    url: "/feature/telemetry"
    description: "A feature that captures per-operation execution telemetry (SQL statement, elapsed time, session, client, source assembly) via an ITrace-based pipeline and publishes it to an insights collector."

  - title: "Tracing"
    url: "/feature/tracing"
    description: "This is a feature that would allow you to log, audit and debug the command execution context (i.e.: SQL Statement, Parameters, Elapsed Time) via TraceLog class."

  - title: "Transaction"
    url: "/feature/transaction"
    description: "A process of making the executions more ACID in nature."

  - title: "Type Mapping"
    url: "/feature/typemapping"
    description: "This is a feature that would allow you to map the .NET CLR type into its equivalent database type."

- key: operations
  title: "Operations"
  url: "/operation/average"
  isdoc: true
  description: "Below are the list of operations available."
  topics:

  - title: "Average"
    url: "/operation/average"
    description: "This method computes the average value of the target field."
  
  - title: "AverageAll"
    url: "/operation/averageall"
    description: "This method computes the average value of the target field across all rows."
  
  - title: "BatchQuery"
    url: "/operation/batchquery"
    description: "This method queries rows from the database in batches."
  
  - title: "BulkDelete"
    url: "/operation/sqlserver/bulkdelete"
    description: "This method deletes rows from the database in bulk. It is supported for [SQL Server](https://www.nuget.org/packages/RepoDb.SqlServer.BulkOperations) and [Oracle](https://www.nuget.org/packages/RepoDb.Oracle.BulkOperations). Oracle also has a dedicated [BulkDeleteByKey](/operation/oracle/bulkdeletebykey) operation for deleting by primary key."
  
  - title: "BulkInsert"
    url: "/operation/sqlserver/bulkinsert"
    description: "This method inserts all rows from the client application into the database in bulk. It is supported for [SQL Server](https://www.nuget.org/packages/RepoDb.SqlServer.BulkOperations) and [Oracle](https://www.nuget.org/packages/RepoDb.Oracle.BulkOperations)."
    
  - title: "BulkMerge"
    url: "/operation/sqlserver/bulkmerge"
    description: "This method merges all rows from the client application into the database in bulk. It is supported for [SQL Server](https://www.nuget.org/packages/RepoDb.SqlServer.BulkOperations) and [Oracle](https://www.nuget.org/packages/RepoDb.Oracle.BulkOperations)."
    
  - title: "BulkUpdate"
    url: "/operation/sqlserver/bulkupdate"
    description: "This method updates all rows from the client application in the database in bulk. It is supported for [SQL Server](https://www.nuget.org/packages/RepoDb.SqlServer.BulkOperations) and [Oracle](https://www.nuget.org/packages/RepoDb.Oracle.BulkOperations)."
    
  - title: "Count"
    url: "/operation/count"
    description: "This method counts the number of rows in a table."
    
  - title: "CountAll"
    url: "/operation/countall"
    description: "This method counts all rows in a table."
    
  - title: "Delete"
    url: "/operation/delete"
    description: "This method deletes rows from a table."
    
  - title: "DeleteAll"
    url: "/operation/deleteall"
    description: "This method deletes all rows, or a specified set of rows by primary key, from a table."
    
  - title: "ExecuteNonQuery"
    url: "/operation/executenonquery"
    description: "This method executes a raw SQL statement directly against the database and returns the number of rows affected. It supports all RDBMS data providers."
  
  - title: "ExecuteQuery"
    url: "/operation/executequery"
    description: "This method executes a raw SQL statement directly against the database and returns an [IEnumerable](https://learn.microsoft.com/en-us/dotnet/api/system.collections.generic.ienumerable-1?view=net-7.0) object. It supports all RDBMS data providers."
  
  - title: "ExecuteQueryMultiple"
    url: "/operation/executequerymultiple"
    description: "This method executes multiple raw SQL statements against the database in a single round-trip and returns a [QueryMultipleExtractor](/class/querymultipleextractor) object. It supports all RDBMS data providers."
  
  - title: "ExecuteReader"
    url: "/operation/executereader"
    description: "This method executes a raw SQL statement directly against the database and returns a [DbDataReader](https://learn.microsoft.com/en-us/dotnet/api/system.data.common.dbdatareader?view=net-6.0) object. It supports all RDBMS data providers."
  
  - title: "ExecuteScalar"
    url: "/operation/executescalar"
    description: "This method executes a raw SQL statement directly against the database and returns the value of the first column of the first row from the result set. It supports all RDBMS data providers."
  
  - title: "Exists"
    url: "/operation/exists"
    description: "This method checks whether matching rows exist in a table."
    
  - title: "Insert"
    url: "/operation/insert"
    description: "This method inserts a data entity object as a new row in the table."
    
  - title: "InsertAll"
    url: "/operation/insertall"
    description: "This method inserts multiple data entity objects as new rows in the table."
    
  - title: "Max"
    url: "/operation/max"
    description: "This method computes the maximum value of the target field."
    
  - title: "MaxAll"
    url: "/operation/maxall"
    description: "This method computes the maximum value of the target field across all rows."

  - title: "Merge"
    url: "/operation/merge"
    description: "This method inserts a new row or updates an existing row in the table. It operates as an UPSERT and does not perform any deletion."
    
  - title: "MergeAll"
    url: "/operation/mergeall"
    description: "This method inserts multiple data entity objects as new rows or updates existing rows in the table. It operates as an UPSERT and does not perform any deletion."
    
  - title: "Min"
    url: "/operation/min"
    description: "This method computes the minimum value of the target field."
    
  - title: "MinAll"
    url: "/operation/minall"
    description: "This method computes the minimum value of the target field across all rows."
    
  - title: "Query"
    url: "/operation/query"
    description: "This method queries rows from a table."
    
  - title: "QueryAll"
    url: "/operation/queryall"
    description: "This method queries all rows from a table."
    
  - title: "QueryMultiple"
    url: "/operation/querymultiple"
    description: "This method queries data as multiple result sets from the table based on the given target types."
    
  - title: "Sum"
    url: "/operation/sum"
    description: "This method computes the sum of the target field."
    
  - title: "SumAll"
    url: "/operation/sumall"
    description: "This method computes the sum of the target field across all rows."
    
  - title: "Truncate"
    url: "/operation/truncate"
    description: "This method truncates a table in the database."
    
  - title: "Update"
    url: "/operation/update"
    description: "Updates an existing row in the table."
    
  - title: "UpdateAll"
    url: "/operation/updateall"
    description: "Updates multiple existing rows in the table in a single call."

