- key: mappers
  title: "Mappers"
  url: "/mapper/classmapper"
  isdoc: true
  description: "Below are the list of mappers available."
  topics:

  - title: "ClassMapper"
    url: "/mapper/classmapper"
    description: "A mapper class that is being used to map the class into its equivalent object in the database (i.e.: Table, View). This class is used as an alternative to Map attribute."
    
  - title: "ClassHandlerMapper"
    url: "/mapper/classhandlermapper"
    description: "A class that is being used to map a class handler into a class. This class is used as an alternative to ClassHandler attribute."
  
  - title: "DbHelperMapper"
    url: "/mapper/dbhelpermapper"
    description: "A mapper class for all the database helper classes. The mapping can be made based on the type of the target RDBMS data provider."
    
  - title: "DbSettingMapper"
    url: "/mapper/dbsettingmapper"
    description: "A mapper class for all the database setting classes. The mapping can be made based on the type of the target RDBMS data provider."
    
  - title: "FluentMapper"
    url: "/mapper/fluentmapper"
    description: "A class that is being used to define a mapping for the target data entity in a fluent way."
    
  - title: "IdentityMapper"
    url: "/mapper/identitymapper"
    description: "A mapper class that is being used to map a class property to be an identity property. This class is used as an alternative to Identity attribute."
    
  - title: "PrimaryMapper"
    url: "/mapper/primarymapper"
    description: "A mapper class that is being used to map a class property to be primary property. This class is used as an alternative to Primary attribute."
    
  - title: "PropertyMapper"
    url: "/mapper/propertymapper"
    description: "A mapper class that is being used to map the class property into its equivalent column in the database. This class is used as an alternative to Map attribute."
    
  - title: "PropertyHandlerMapper"
    url: "/mapper/propertyhandlermapper"
    description: "A class that is being used to map a property handler into a .NET CLR type or a class property. This class is used as an alternative to PropertyHandler attribute."
    
  - title: "PropertyValueAttributeMapper"
    url: "/mapper/propertyvalueattributemapper"
    description: "A mapper class that is being used to map the list PropertyValueAttribute objects into a class property. This class is used as an alternative to the PropertyValueAttribute attributes."
    
  - title: "StatementBuilderMapper"
    url: "/mapper/statementbuildermapper"
    description: "A mapper class for all the statement builder classes. The mapping can be made based on the type of the target RDBMS data provider."
    
  - title: "TypeMapper"
    url: "/mapper/typemapper"
    description: "A class that is being used to map a .NET CLR type or class property into its equivalent database type. This class is used as an alternative to TypeMap attribute."
    
