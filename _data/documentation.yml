- key: interfaces
  title: "Interfaces"
  url: "/interface/icache"
  isdoc: true
  description: "Below are the list of interfaces available."
  topics:

  - title: "ICache"
    url: "/interface/icache"
    description: "This interface is used to mark a class to be a cache object. It gives you the full control on the implementations of your own cache object (i.e.: File Caching, SqLite Caching, XML Caching, Memory Caching, etc)."

  - title: "IDbHelper"
    url: "/interface/idbhelper"
    description: "This interface is used to mark a class to be a database helper object. It is very useful if you would like optimize and override the default implementation of the library (i.e.: retrieving the list of fields, retrieving newly generated identity)."

  - title: "IDbSetting"
    url: "/interface/idbsetting"
    description: "This interface is used to mark a class to be a database setting object. It allows you to control the behavior of the library on a specific RDBMS data provider based on the value you provided on the properties this class."

  - title: "IExpirable"
    url: "/interface/iexpirable"
    description: "This interface is used to make a class expirable in a contextual point of view. Is is used by [CacheItem](/class/cacheitem) class."

  - title: "IPropertyHandler"
    url: "/interface/ipropertyhandler"
    description: "This interface marks a class as a property handler. It exposes `TInput` and `TResult` generic type parameters used by both the `Get()` and `Set()` methods."

  - title: "IResolver"
    url: "/interface/iresolver"
    description: "This interface is used to mark a class to be a resolver object. This interface accepts upto the maximum 7 input generic types and 1 output generic type."

  - title: "IStatementBuilder"
    url: "/interface/istatementbuilder"
    description: "This interface is used to mark a class to be a statement builder object. I provides necessary methods for your to be able to override the way how the SQL statements are being constructed."

  - title: "ITrace"
    url: "/interface/itrace"
    description: "This interface is used to mark a class to be a trace object."

